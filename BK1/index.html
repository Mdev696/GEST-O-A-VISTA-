<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Backlog · Anéis Comutados e HLs</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrap">
        <header>
            <div>
                <h1>Backlog · Anéis Comutados e HLs</h1>
                <div class="sub" id="meta">Dados de exemplo · importe o .xlsx para usar os seus</div>
            </div>
            <div class="btns">
                <label class="file">Importar planilha<input id="file" type="file" accept=".xlsx,.xls,.csv"
                        hidden></label>
                <button id="clear" type="button" class="danger">Limpar tabela</button>
                <button id="theme" type="button">Tema</button>
            </div>
        </header>

        <div class="strip" id="strip"></div>

        <div class="bar">
            <input id="q" type="search" placeholder="Buscar ticket, localidade, site ou hostname">
            <select id="uf" aria-label="UF">
                <option value="">Todas as UFs</option>
            </select>
            <select id="gr" aria-label="Grupo">
                <option value="">Todos os grupos</option>
            </select>
            <button id="max" type="button" aria-pressed="false">Maximizar tabela</button>
        </div>

        <div class="tbl">
            <table>
                <thead>
                    <tr>
                        <th>Sequência</th>
                        <th>Raiz</th>
                        <th>Prior.</th>
                        <th>Aging</th>
                        <th>Grupo</th>
                        <th>Localidade</th>
                        <th>Gestor atual</th>
                        <th>UF</th>
                        <th>Site</th>
                        <th>Criação</th>
                        <th>T. decorrido</th>
                        <th>Status</th>
                        <th>Hostname</th>
                        <th>Risco de afetação</th>
                    </tr>
                </thead>
                <tbody id="tb"></tbody>
            </table>
            <div id="empty" class="empty" hidden>Nenhum ticket com esses filtros.</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
